[project]
name = "moc-fetcher"
version = "0.1.0"
description = "Host-Mac browser fetcher for my-own-collection (real Chrome over CDP)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.8", "pydantic-settings>=2.4",
  "playwright>=1.47", "httpx>=0.27",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
[tool.setuptools.packages.find]
include = ["fetcher*"]
[tool.ruff]
line-length = 100
