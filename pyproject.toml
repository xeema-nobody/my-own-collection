[project]
name = "my-own-collection"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "motor>=3.6", "pymongo>=4.9",
  "pydantic>=2.8", "pydantic-settings>=2.4", "httpx>=0.27", "tenacity>=9.0",
  "apscheduler>=3.10", "beautifulsoup4>=4.12",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "respx>=0.21", "mongomock-motor>=0.0.34"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.ruff]
line-length = 100
